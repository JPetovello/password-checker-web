<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password & Passphrase Analyzer</title>
    
    <script>
        (function() {
            const savedTheme = localStorage.getItem('pcw-theme');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (systemDark ? 'dark' : 'light');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>

    <style>
        /* Light Mode (High Contrast - Minimum 4.5:1 / 7:1) */
        :root {
            --bg-body: #f1f5f9;
            --bg-main: #ffffff;
            --bg-card: #f8fafc;
            --bg-box: #ffffff;
            --border-color: #94a3b8; /* Stronger borders */
            --text-primary: #0f172a; /* 15:1 contrast */
            --text-heading: #0f172a;
            --text-muted: #334155;   /* Crisp slate for small text */
            --input-bg: #ffffff;
            --btn-primary: #0284c7;
            --btn-text: #ffffff;
            --meter-0: #dc2626;
            --meter-1: #c2410c;
            --meter-2: #b45309;
            --meter-3: #0369a1;
            --meter-4: #15803d;
            --meter-bg: #cbd5e1;
        }

        /* Dark Mode (High Contrast - Minimum 4.5:1 / 7:1) */
        html.dark {
            --bg-body: #0b0f19;        /* Pitch slate background */
            --bg-main: #111827;        /* Dark card background */
            --bg-card: #1f2937;        /* Distinct section background */
            --bg-box: #111827;         /* Inset box background */
            --border-color: #4b5563;   /* High-visibility borders */
            --text-primary: #ffffff;   /* Pure white main text */
            --text-heading: #38bdf8;   /* High-contrast cyan headers */
            --text-muted: #cbd5e1;     /* Light slate for small labels */
            --input-bg: #030712;       /* Very dark input boxes for depth */
            --btn-primary: #0284c7;
            --btn-text: #ffffff;
            --meter-0: #f87171;
            --meter-1: #fb923c;
            --meter-2: #fbbf24;
            --meter-3: #38bdf8;
            --meter-4: #4ade80;
            --meter-bg: #374151;
        }

        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background-color: var(--bg-body); 
            color: var(--text-primary); 
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        main { 
            background: var(--bg-main); 
            padding: 2.5rem; 
            border-radius: 0.75rem; 
            box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.5); 
            width: 100%; 
            max-width: 850px; 
            box-sizing: border-box; 
            border: 1px solid var(--border-color);
            transition: background 0.2s ease;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .header-row h1 {
            margin: 0;
            font-size: 1.75rem;
            color: var(--text-primary);
        }

        .theme-toggle-btn {
            background: var(--input-bg);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.4rem 0.8rem;
            border-radius: 0.375rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.9rem;
            font-weight: 600;
            width: auto;
            margin: 0;
        }

        .theme-toggle-btn:hover {
            background: var(--bg-card);
        }

        .card { 
            background: var(--bg-card); 
            border: 1px solid var(--border-color); 
            padding: 1.75rem; 
            border-radius: 0.5rem; 
            margin-bottom: 1.5rem; 
        }

        .card h2 { 
            margin-top: 0; 
            font-size: 1.25rem; 
            margin-bottom: 1rem; 
            color: var(--text-heading); 
        }

        input, select { 
            width: 100%; 
            padding: 0.85rem; 
            margin-top: 0.5rem; 
            margin-bottom: 1rem; 
            border-radius: 0.375rem; 
            border: 2px solid var(--border-color); 
            background: var(--input-bg); 
            color: var(--text-primary); 
            font-size: 1.05rem; 
            font-weight: 500;
            box-sizing: border-box; 
            text-align: center; 
        }

        input:focus, select:focus { 
            outline: 3px solid #38bdf8; 
            outline-offset: 1px;
        }

        button { 
            width: 100%;
            padding: 0.85rem;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
            border-radius: 0.375rem;
            background: var(--btn-primary); 
            color: var(--btn-text); 
            border: none; 
            cursor: pointer; 
            font-size: 1rem;
            font-weight: 700; 
            transition: background 0.2s; 
        }

        button:hover { 
            filter: brightness(1.15); 
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 1rem; 
            margin-top: 1rem; 
        }

        .metric-box { 
            background: var(--bg-box); 
            padding: 1rem; 
            border-radius: 0.375rem; 
            text-align: center; 
            border: 1px solid var(--border-color); 
        }

        .metric-title { 
            font-size: 0.8rem; 
            font-weight: 700;
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            margin-bottom: 0.35rem; 
        }

        .metric-value { 
            font-size: 1.2rem; 
            font-weight: 800; 
            color: var(--text-primary); 
        }

        .meter-container {
            width: 100%;
            height: 8px;
            background-color: var(--meter-bg);
            border-radius: 4px;
            margin-top: 0.6rem;
            overflow: hidden;
            display: block;
        }

        .meter-bar {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .generator-row { 
            display: flex; 
            gap: 0.75rem; 
            align-items: center; 
        }

        .generator-row input { 
            margin-bottom: 0; 
        }

        .generator-row button { 
            width: 130px; 
            margin-top: 0; 
            margin-bottom: 0; 
            height: 48px; 
        }
    </style>
</head>
<body>
    <main>
        <div class="header-row">
            <h1>Password & Passphrase Analyzer</h1>
            
            <button 
                id="theme-toggle" 
                class="theme-toggle-btn" 
                type="button" 
                aria-label="Switch theme"
                aria-pressed="false"
            >
                <span id="theme-icon" aria-hidden="true">🌙</span>
                <span id="theme-text">Dark</span>
            </button>
        </div>
        
        <div class="card">
            <h2>Password Strength Evaluator</h2>
            <input type="text" id="passwordInput" placeholder="Enter password to analyze..." aria-label="Password to evaluate">
            
            <div class="grid">
                <div class="metric-box">
                    <div class="metric-title">Score</div>
                    <div class="metric-value" id="scoreVal">- / 4</div>
                    <div class="meter-container" aria-hidden="true">
                        <div id="meterBar" class="meter-bar"></div>
                    </div>
                </div>
                <div class="metric-box">
                    <div class="metric-title">Entropy</div>
                    <div class="metric-value" id="entropyVal">0 bits</div>
                </div>
                <div class="metric-box">
                    <div class="metric-title">Length</div>
                    <div class="metric-value" id="lengthVal">0 chars</div>
                </div>
            </div>

            <div class="grid" style="grid-template-columns: repeat(3, 1fr);">
                <div class="metric-box"><div class="metric-title">Online Attack</div><div class="metric-value" id="onlineVal" style="font-size: 0.95rem;">-</div></div>
                <div class="metric-box"><div class="metric-title">Offline Fast Hash (GPU)</div><div class="metric-value" id="fastHashVal" style="font-size: 0.95rem;">-</div></div>
                <div class="metric-box"><div class="metric-title">Offline Slow Hash</div><div class="metric-value" id="slowHashVal" style="font-size: 0.95rem;">-</div></div>
            </div>

            <div class="metric-box" style="margin-top: 1rem;">
                <div class="metric-title">Breach Exposure (HIBP)</div>
                <div class="metric-value" id="hibpVal" style="font-size: 0.95rem; font-weight: normal;">-</div>
            </div>
        </div>

        <div class="card" style="margin-bottom: 0;">
            <h2>EFF Passphrase Generator</h2>
            <div class="generator-row">
                <input type="text" id="passphraseOutput" readonly placeholder="Generated passphrase...">
                <button type="button" id="copyBtn">Copy</button>
            </div>
            
            <label for="wordCountSelect" style="display: block; margin-top: 1rem; font-size: 0.9rem; font-weight: 600; color: var(--text-muted);">Number of Words</label>
            <select id="wordCountSelect">
                <option value="3">3 Words</option>
                <option value="4" selected>4 Words</option>
                <option value="5">5 Words</option>
                <option value="6">6 Words</option>
                <option value="7">7 Words</option>
                <option value="8">8 Words</option>
            </select>

            <button type="button" id="generateBtn" style="margin-top: 0.5rem; margin-bottom: 0;">Generate Passphrase</button>
        </div>
    </main>

    {% include 'footer.html' %}

    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        function updateThemeUI(isDark) {
            toggleBtn.setAttribute('aria-pressed', isDark);
            toggleBtn.setAttribute('aria-label', `Switch to ${isDark ? 'light' : 'dark'} theme`);
            themeIcon.textContent = isDark ? '☀️' : '🌙';
            themeText.textContent = isDark ? 'Light' : 'Dark';
        }

        const isDarkInitial = document.documentElement.classList.contains('dark');
        updateThemeUI(isDarkInitial);

        toggleBtn.addEventListener('click', () => {
            const isDarkNow = document.documentElement.classList.toggle('dark');
            localStorage.setItem('pcw-theme', isDarkNow ? 'dark' : 'light');
            updateThemeUI(isDarkNow);
        });

        document.getElementById('generateBtn').addEventListener('click', async () => {
            const wordCount = document.getElementById('wordCountSelect').value;
            try {
                const response = await fetch(`/api/generate?words=${wordCount}`);
                const data = await response.json();
                if (data.passphrase) {
                    document.getElementById('passphraseOutput').value = data.passphrase;
                }
            } catch (err) {
                console.error('Failed to generate passphrase', err);
            }
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            const output = document.getElementById('passphraseOutput');
            if (!output.value) return;

            output.select();
            output.setSelectionRange(0, 99999);

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    const copyBtn = document.getElementById('copyBtn');
                    const originalText = copyBtn.innerText;
                    copyBtn.innerText = 'Copied!';
                    setTimeout(() => {
                        copyBtn.innerText = originalText;
                    }, 1500);
                }
            } catch (err) {
                console.error('Fallback copy failed', err);
            }
        });

        document.getElementById('passwordInput').addEventListener('input', (e) => {
            evaluatePassword(e.target.value);
        });

        const meterColors = [
            'var(--meter-0)',
            'var(--meter-1)',
            'var(--meter-2)',
            'var(--meter-3)',
            'var(--meter-4)'
        ];

        const meterWidths = ['15%', '35%', '55%', '80%', '100%'];

        async function evaluatePassword(password) {
            const meterBar = document.getElementById('meterBar');
            document.getElementById('lengthVal').innerText = password.length + ' chars';
            
            if (!password) {
                document.getElementById('scoreVal').innerText = '- / 4';
                document.getElementById('scoreVal').style.color = 'var(--text-primary)';
                document.getElementById('entropyVal').innerText = '0 bits';
                document.getElementById('onlineVal').innerText = '-';
                document.getElementById('fastHashVal').innerText = '-';
                document.getElementById('slowHashVal').innerText = '-';
                document.getElementById('hibpVal').innerText = '-';
                document.getElementById('hibpVal').style.color = 'var(--text-primary)';
                meterBar.style.width = '0%';
                return;
            }

            try {
                const response = await fetch('/api/evaluate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: password })
                });
                const data = await response.json();
                const score = (data.score !== undefined && data.score >= 0 && data.score <= 4) ? data.score : 0;
                
                document.getElementById('scoreVal').innerText = score + ' / 4';
                document.getElementById('scoreVal').style.color = meterColors[score];

                meterBar.style.width = meterWidths[score];
                meterBar.style.backgroundColor = meterColors[score];

                document.getElementById('entropyVal').innerText = (data.entropy !== undefined ? Math.round(data.entropy) : 0) + ' bits';
                document.getElementById('onlineVal').innerText = data.crack_times_display?.online_throttling_100_per_hour || '-';
                document.getElementById('fastHashVal').innerText = data.crack_times_display?.offline_fast_hashing_1e10_per_second || '-';
                document.getElementById('slowHashVal').innerText = data.crack_times_display?.offline_slow_hashing_1e4_per_second || '-';
                
                if (data.hibp) {
                    if (data.hibp.found) {
                        document.getElementById('hibpVal').innerText = `Found in ${data.hibp.count} breaches!`;
                        document.getElementById('hibpVal').style.color = '#f87171';
                    } else {
                        document.getElementById('hibpVal').innerText = 'No breaches found';
                        document.getElementById('hibpVal').style.color = '#4ade80';
                    }
                }
            } catch (err) {
                console.error('Evaluation error', err);
            }
        }
    </script>
</body>
</html>
