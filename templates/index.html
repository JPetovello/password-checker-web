<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password & Passphrase Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center py-10">

    <h1 class="text-3xl font-bold mb-8 text-cyan-400">Password & Passphrase Analyzer</h1>

    <div class="w-full max-w-4xl space-y-8 px-4">
        
        <!-- Password Strength Evaluator Section -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
            <h2 class="text-xl font-semibold mb-4 text-cyan-300">Password Strength Evaluator</h2>
            <div class="flex gap-2 mb-6">
                <input type="password" id="passwordInput" placeholder="Type password to evaluate..." class="flex-grow bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-cyan-500">
                <button id="evaluateBtn" class="bg-cyan-600 hover:bg-cyan-500 px-6 py-2 rounded-lg font-medium transition">Evaluate</button>
            </div>

            <!-- 3x2 Grid Layout -->
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-slate-900/50 border border-slate-700/60 p-4 rounded-lg text-center">
                    <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Score</div>
                    <div id="scoreVal" class="text-lg font-bold text-slate-200">-</div>
                </div>
                <div class="bg-slate-900/50 border border-slate-700/60 p-4 rounded-lg text-center">
                    <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Entropy</div>
                    <div id="entropyVal" class="text-lg font-bold text-slate-200">-</div>
                </div>
                <div class="bg-slate-900/50 border border-slate-700/60 p-4 rounded-lg text-center">
                    <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Length</div>
                    <div id="lengthVal" class="text-lg font-bold text-slate-200">-</div>
                </div>
                <div class="bg-slate-900/50 border border-slate-700/60 p-4 rounded-lg text-center">
                    <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Online Attack</div>
                    <div id="onlineVal" class="text-lg font-bold text-slate-200">-</div>
                </div>
                <div class="bg-slate-900/50 border border-slate-700/60 p-4 rounded-lg text-center">
                    <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Offline Fast Hash (GPU)</div>
                    <div id="fastHashVal" class="text-lg font-bold text-slate-200">-</div>
                </div>
                <div class="bg-slate-900/50 border border-slate-700/60 p-4 rounded-lg text-center">
                    <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Offline Slow Hash</div>
                    <div id="slowHashVal" class="text-lg font-bold text-slate-200">-</div>
                </div>
            </div>
        </div>

        <!-- EFF Passphrase Generator Section -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
            <h2 class="text-xl font-semibold mb-4 text-cyan-300">EFF Passphrase Generator</h2>
            <div class="bg-slate-900/50 border border-dashed border-slate-600 rounded-lg p-6 text-center mb-4 text-slate-400" id="passphraseOutput">
                Click generate below
            </div>
            <button id="generateBtn" class="w-full bg-cyan-600 hover:bg-cyan-500 py-2 rounded-lg font-medium transition mb-6">Generate Passphrase & Analyze</button>

            <!-- 3x2 Grid Layout -->
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-slate-900/50 border border-slate-700/60 p-4 rounded-lg text-center">
                    <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Score</div>
                    <div id="genScoreVal" class="text-lg font-bold text-slate-200">-</div>
                </div>
                <div class="bg-slate-900/50 border border-slate-700/60 p-4 rounded-lg text-center">
                    <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Entropy</div>
                    <div id="genEntropyVal" class="text-lg font-bold text-slate-200">-</div>
                </div>
                <div class="bg-slate-900/50 border border-slate-700/60 p-4 rounded-lg text-center">
                    <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Length</div>
                    <div id="genLengthVal" class="text-lg font-bold text-slate-200">-</div>
                </div>
                <div class="bg-slate-900/50 border border-slate-700/60 p-4 rounded-lg text-center">
                    <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Online Attack</div>
                    <div id="genOnlineVal" class="text-lg font-bold text-slate-200">-</div>
                </div>
                <div class="bg-slate-900/50 border border-slate-700/60 p-4 rounded-lg text-center">
                    <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Offline Fast Hash (GPU)</div>
                    <div id="genFastHashVal" class="text-lg font-bold text-slate-200">-</div>
                </div>
                <div class="bg-slate-900/50 border border-slate-700/60 p-4 rounded-lg text-center">
                    <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Offline Slow Hash</div>
                    <div id="genSlowHashVal" class="text-lg font-bold text-slate-200">-</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        document.getElementById('evaluateBtn').addEventListener('click', async () => {
            const pwd = document.getElementById('passwordInput').value;
            if (!pwd) return;
            try {
                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pwd })
                });
                const data = await response.json();
                document.getElementById('scoreVal').innerText = data.score ?? '-';
                document.getElementById('entropyVal').innerText = data.entropy ?? '-';
                document.getElementById('lengthVal').innerText = pwd.length;
                document.getElementById('onlineVal').innerText = data.online_attack ?? '-';
                document.getElementById('fastHashVal').innerText = data.fast_hash ?? '-';
                document.getElementById('slowHashVal').innerText = data.slow_hash ?? '-';
            } catch (err) {
                console.error(err);
            }
        });

        document.getElementById('generateBtn').addEventListener('click', async () => {
            try {
                const response = await fetch('/api/generate', { method: 'POST' });
                const data = await response.json();
                document.getElementById('passphraseOutput').innerText = data.passphrase;
                document.getElementById('genScoreVal').innerText = data.score ?? '-';
                document.getElementById('genEntropyVal').innerText = data.entropy ?? '-';
                document.getElementById('genLengthVal').innerText = data.passphrase.length;
                document.getElementById('genOnlineVal').innerText = data.online_attack ?? '-';
                document.getElementById('genFastHashVal').innerText = data.fast_hash ?? '-';
                document.getElementById('genSlowHashVal').innerText = data.slow_hash ?? '-';
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
