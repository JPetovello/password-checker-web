<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password & Passphrase Analyzer</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #0f172a; color: #f8fafc; }
        main { background: #1e293b; padding: 2.5rem; border-radius: 0.75rem; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3); width: 100%; max-width: 850px; box-sizing: border-box; }
        .card { background: #0f172a; border: 1px solid #475569; padding: 1.75rem; border-radius: 0.5rem; margin-bottom: 1.5rem; }
        .card h2 { margin-top: 0; font-size: 1.25rem; margin-bottom: 1rem; color: #e2e8f0; }
        input, select, button { width: 100%; padding: 0.85rem; margin-top: 0.5rem; margin-bottom: 1rem; border-radius: 0.375rem; border: 1px solid #475569; background: #1e293b; color: #fff; font-size: 1rem; box-sizing: border-box; text-align: center; }
        input:focus, select:focus { outline: none; border-color: #3b82f6; }
        button { background: #3b82f6; border: none; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #2563eb; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-top: 1rem; }
        .metric-box { background: #1e293b; padding: 1rem; border-radius: 0.375rem; text-align: center; border: 1px solid #334155; }
        .metric-title { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.35rem; }
        .metric-value { font-size: 1.15rem; font-weight: bold; color: #f8fafc; }
        .generator-row { display: flex; gap: 0.75rem; align-items: center; }
        .generator-row input { margin-bottom: 0; background: #1e293b; }
        .generator-row button { width: 130px; margin-top: 0; margin-bottom: 0; height: 48px; }
    </style>
</head>
<body>
    <main>
        <h1 style="text-align: center; margin-top: 0; margin-bottom: 2rem; font-size: 1.75rem;">Password & Passphrase Analyzer</h1>
        
        <div class="card">
            <h2>Password Strength Evaluator</h2>
            <input type="text" id="passwordInput" placeholder="Enter password to analyze..." aria-label="Password to evaluate">
            
            <div class="grid">
                <div class="metric-box">
                    <div class="metric-title">Score</div>
                    <div class="metric-value" id="scoreVal">- / 4</div>
                </div>
                <div class="metric-box">
                    <div class="metric-title">Entropy</div>
                    <div class="metric-value" id="entropyVal">0 bits</div>
                </div>
                <div class="metric-box">
                    <div class="metric-title">Length</div>
                    <div class="metric-value" id="lengthVal">0 chars</div>
                </div>
            </div>

            <div class="grid" style="grid-template-columns: repeat(3, 1fr);">
                <div class="metric-box"><div class="metric-title">Online Attack</div><div class="metric-value" id="onlineVal" style="font-size: 0.95rem;">-</div></div>
                <div class="metric-box"><div class="metric-title">Offline Fast Hash (GPU)</div><div class="metric-value" id="fastHashVal" style="font-size: 0.95rem;">-</div></div>
                <div class="metric-box"><div class="metric-title">Offline Slow Hash</div><div class="metric-value" id="slowHashVal" style="font-size: 0.95rem;">-</div></div>
            </div>

            <div class="metric-box" style="margin-top: 1rem;">
                <div class="metric-title">Breach Exposure (HIBP)</div>
                <div class="metric-value" id="hibpVal" style="font-size: 0.95rem; font-weight: normal;">-</div>
            </div>
        </div>

        <div class="card" style="margin-bottom: 0;">
            <h2>EFF Passphrase Generator</h2>
            <div class="generator-row">
                <input type="text" id="passphraseOutput" readonly placeholder="Generated passphrase...">
                <button type="button" id="copyBtn">Copy</button>
            </div>
            
            <label for="wordCountSelect" style="display: block; margin-top: 1rem; font-size: 0.9rem; color: #94a3b8;">Number of Words</label>
            <select id="wordCountSelect">
                <option value="3">3 Words</option>
                <option value="4" selected>4 Words</option>
                <option value="5">5 Words</option>
                <option value="6">6 Words</option>
                <option value="7">7 Words</option>
                <option value="8">8 Words</option>
            </select>

            <button type="button" id="generateBtn" style="margin-top: 0.5rem; margin-bottom: 0;">Generate Passphrase</button>
        </div>
    </main>

    {% include 'footer.html' %}

    <script>
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const wordCount = document.getElementById('wordCountSelect').value;
            try {
                const response = await fetch(`/api/generate?words=${wordCount}`);
                const data = await response.json();
                if (data.passphrase) {
                    document.getElementById('passphraseOutput').value = data.passphrase;
                }
            } catch (err) {
                console.error('Failed to generate passphrase', err);
            }
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            const output = document.getElementById('passphraseOutput');
            if (!output.value) return;

            output.select();
            output.setSelectionRange(0, 99999); // For mobile devices

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    const copyBtn = document.getElementById('copyBtn');
                    const originalText = copyBtn.innerText;
                    copyBtn.innerText = 'Copied!';
                    setTimeout(() => {
                        copyBtn.innerText = originalText;
                    }, 1500);
                }
            } catch (err) {
                console.error('Fallback copy failed', err);
            }
        });

        document.getElementById('passwordInput').addEventListener('input', (e) => {
            evaluatePassword(e.target.value);
        });

        async function evaluatePassword(password) {
            document.getElementById('lengthVal').innerText = password.length + ' chars';
            if (!password) {
                document.getElementById('scoreVal').innerText = '- / 4';
                document.getElementById('entropyVal').innerText = '0 bits';
                document.getElementById('onlineVal').innerText = '-';
                document.getElementById('fastHashVal').innerText = '-';
                document.getElementById('slowHashVal').innerText = '-';
                document.getElementById('hibpVal').innerText = '-';
                document.getElementById('hibpVal').style.color = '#f8fafc';
                return;
            }

            try {
                const response = await fetch('/api/evaluate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: password })
                });
                const data = await response.json();
                
                document.getElementById('scoreVal').innerText = (data.score !== undefined ? data.score : '-') + ' / 4';
                document.getElementById('entropyVal').innerText = (data.entropy !== undefined ? Math.round(data.entropy) : 0) + ' bits';
                document.getElementById('onlineVal').innerText = data.crack_times_display?.online_throttling_100_per_hour || '-';
                document.getElementById('fastHashVal').innerText = data.crack_times_display?.offline_fast_hashing_1e10_per_second || '-';
                document.getElementById('slowHashVal').innerText = data.crack_times_display?.offline_slow_hashing_1e4_per_second || '-';
                
                if (data.hibp) {
                    if (data.hibp.found) {
                        document.getElementById('hibpVal').innerText = `Found in ${data.hibp.count} breaches!`;
                        document.getElementById('hibpVal').style.color = '#ef4444';
                    } else {
                        document.getElementById('hibpVal').innerText = 'No breaches found';
                        document.getElementById('hibpVal').style.color = '#22c55e';
                    }
                }
            } catch (err) {
                console.error('Evaluation error', err);
            }
        }
    </script>
</body>
</html>
