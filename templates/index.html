<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password & Passphrase Tool</title>
    <script>
        // Prevent theme flicker
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <style>
        :root {
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --input-bg: #f9fafb;
            --meter-bg: #e5e7eb;
            --color-danger: #dc2626;
            --color-warning: #d97706;
            --color-success: #16a34a;
        }

        html.dark {
            --bg-body: #111827;
            --bg-card: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --input-bg: #111827;
            --meter-bg: #374151;
            --color-danger: #f87171;
            --color-warning: #fbbf24;
            --color-success: #4ade80;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 500;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-bottom: 1rem;
            font-size: 1.25rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        input[type="password"], input[type="text"], select {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            color: var(--text-main);
            font-size: 1rem;
        }

        .meter-container {
            height: 0.5rem;
            background-color: var(--meter-bg);
            border-radius: 0.25rem;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .meter-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
        }

        .metric-box {
            padding: 0.75rem;
            background-color: var(--input-bg);
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .metric-value {
            font-size: 1rem;
            font-weight: 600;
            margin-top: 0.25rem;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        .btn:hover {
            background-color: #2563eb;
        }

        .output-group {
            display: flex;
            gap: 0.5rem;
        }

        .text-danger { color: var(--color-danger); }
        .text-warning { color: var(--color-warning); }
        .text-success { color: var(--color-success); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Security Tool</h1>
        <button id="themeToggle" class="theme-toggle">
            <span id="themeIcon">🌙</span> <span id="themeText">Dark Mode</span>
        </button>
    </div>

    <!-- Password Checker Section -->
    <div class="card">
        <h2>Password Evaluator</h2>
        <div class="input-group">
            <input type="password" id="passwordInput" placeholder="Enter a password to test..." autocomplete="off">
        </div>
        <div class="meter-container">
            <div id="meterBar" class="meter-bar"></div>
        </div>
        <div class="metrics-grid">
            <div class="metric-box">
                <div class="metric-label">Score</div>
                <div id="scoreVal" class="metric-value">-</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">Length</div>
                <div id="lengthVal" class="metric-value">0 chars</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">Entropy</div>
                <div id="entropyVal" class="metric-value">0 bits</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">HIBP Status</div>
                <div id="hibpVal" class="metric-value">Not checked</div>
            </div>
        </div>
    </div>

    <!-- Passphrase Generator Section -->
    <div class="card">
        <h2>Passphrase Generator</h2>
        <div class="controls-grid">
            <div class="input-group">
                <label class="metric-label" for="wordCount">Word Count</label>
                <select id="wordCount">
                    <option value="3">3 Words</option>
                    <option value="4" selected>4 Words</option>
                    <option value="5">5 Words</option>
                    <option value="6">6 Words</option>
                </select>
            </div>
            <div class="input-group">
                <label class="metric-label" for="separator">Separator</label>
                <select id="separator">
                    <option value="-">Hyphen (-)</option>
                    <option value=" ">Space ( )</option>
                    <option value=".">Dot (.)</option>
                    <option value="_">Underscore (_)</option>
                </select>
            </div>
        </div>
        <button id="generateBtn" class="btn" style="margin-bottom: 1rem;">Generate Passphrase</button>
        <div class="output-group">
            <input type="text" id="passphraseOutput" readonly placeholder="Generated passphrase will appear here...">
            <button id="copyBtn" class="btn" style="width: auto; padding: 0.75rem 1.5rem;">Copy</button>
        </div>
    </div>
</div>

<script>
    // Theme Management
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');

    function syncThemeUI() {
        const isDark = document.documentElement.classList.contains('dark');
        themeIcon.innerText = isDark ? '🌙' : '☀️';
        themeText.innerText = isDark ? 'Dark Mode' : 'Light Mode';
    }

    themeToggle.addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        syncThemeUI();
    });
    syncThemeUI();

    // Password Evaluation with Debounce & AbortController
    let debounceTimer = null;
    let currentAbortController = null;

    document.getElementById('passwordInput').addEventListener('input', (e) => {
        const val = e.target.value;
        clearTimeout(debounceTimer);
        
        debounceTimer = setTimeout(() => {
            evaluatePassword(val);
        }, 200);
    });

    async function evaluatePassword(password) {
        const meterBar = document.getElementById('meterBar');
        const scoreVal = document.getElementById('scoreVal');
        const lengthVal = document.getElementById('lengthVal');
        const entropyVal = document.getElementById('entropyVal');
        const hibpVal = document.getElementById('hibpVal');

        lengthVal.innerText = `${password.length} chars`;

        if (!password) {
            meterBar.style.width = '0%';
            scoreVal.innerText = '-';
            entropyVal.innerText = '0 bits';
            hibpVal.innerText = 'Not checked';
            hibpVal.style.color = '';
            return;
        }

        if (currentAbortController) {
            currentAbortController.abort();
        }
        currentAbortController = new AbortController();

        try {
            const response = await fetch('/api/evaluate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: password }),
                signal: currentAbortController.signal
            });

            if (!response.ok) return;

            const data = await response.json();

            // Update Score & Meter Bar
            scoreVal.innerText = `${data.score} / 4`;
            const percentages = ['10%', '25%', '50%', '75%', '100%'];
            const colors = [
                'var(--color-danger)', 
                'var(--color-danger)', 
                'var(--color-warning)', 
                'var(--color-success)', 
                'var(--color-success)'
            ];
            
            meterBar.style.width = percentages[data.score] || '0%';
            meterBar.style.backgroundColor = colors[data.score] || 'var(--color-danger)';

            // Update Entropy
            entropyVal.innerText = `${data.entropy} bits`;

            // Update HIBP
            if (data.hibp && data.hibp.found) {
                hibpVal.innerText = `Breached (${data.hibp.count}x)`;
                hibpVal.style.color = 'var(--color-danger)';
            } else {
                hibpVal.innerText = 'No breaches';
                hibpVal.style.color = 'var(--color-success)';
            }

        } catch (err) {
            if (err.name !== 'AbortError') {
                console.error('Evaluation error:', err);
            }
        }
    }

    // Passphrase Generator
    document.getElementById('generateBtn').addEventListener('click', async () => {
        const wordCount = document.getElementById('wordCount').value;
        const separator = document.getElementById('separator').value;

        try {
            const response = await fetch(`/api/generate-passphrase?words=${wordCount}&separator=${encodeURIComponent(separator)}`);
            const data = await response.json();
            document.getElementById('passphraseOutput').value = data.passphrase || '';
        } catch (err) {
            console.error('Failed to generate passphrase:', err);
        }
    });

    // Copy to Clipboard (Modern Clipboard API with execCommand fallback)
    document.getElementById('copyBtn').addEventListener('click', async () => {
        const output = document.getElementById('passphraseOutput');
        if (!output.value) return;

        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(output.value);
            } else {
                output.select();
                document.execCommand('copy');
            }

            const copyBtn = document.getElementById('copyBtn');
            const originalText = copyBtn.innerText;
            copyBtn.innerText = 'Copied!';
            setTimeout(() => {
                copyBtn.innerText = originalText;
            }, 1500);
        } catch (err) {
            console.error('Failed to copy text:', err);
        }
    });
</script>
</body>
</html>
