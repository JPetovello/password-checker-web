<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password & Passphrase Analyzer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        h1 {
            font-size: 1.4rem;
            color: #38bdf8;
            margin-bottom: 24px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .container {
            background: rgba(30, 41, 59, 0.65);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 650px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .section-title {
            font-size: 0.9rem;
            color: #38bdf8;
            margin-bottom: 14px;
            font-weight: 500;
            border-bottom: 1px solid rgba(56, 189, 248, 0.15);
            padding-bottom: 6px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #0f172a;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 6px;
            padding: 9px 12px;
            color: #f8fafc;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        .btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            padding: 9px 18px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #0ea5e9;
        }

        .btn-full {
            width: 100%;
            margin-bottom: 14px;
            padding: 11px;
        }

        .passphrase-box {
            background-color: #0f172a;
            border: 1px dashed rgba(56, 189, 248, 0.4);
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            color: #4ade80;
            font-family: monospace;
            font-size: 0.95rem;
            margin-bottom: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .metric-card {
            background-color: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 6px;
            padding: 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 60px;
        }

        .metric-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
            font-weight: 700;
        }

        .metric-value {
            font-size: 0.85rem;
            color: #f8fafc;
            font-weight: 600;
        }

        .feedback-box {
            margin-top: 10px;
            font-size: 0.75rem;
            color: #fbbf24;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <h1>Password & Passphrase Analyzer</h1>

    <!-- Password Strength Evaluator Section -->
    <div class="container">
        <div class="section-title">Password Strength Evaluator</div>
        <div class="input-group">
            <input type="text" id="passwordInput" placeholder="Type password to evaluate..." oninput="evaluatePassword()">
            <button class="btn" onclick="evaluatePassword()">Evaluate</button>
        </div>
        
        <div class="grid">
            <div class="metric-card">
                <span class="metric-label">Score</span>
                <span class="metric-value" id="pwdScore">-</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Entropy</span>
                <span class="metric-value" id="pwdEntropy">-</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Length</span>
                <span class="metric-value" id="pwdLength">-</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Online Attack</span>
                <span class="metric-value" id="pwdOnline">-</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Offline Fast Hash (GPU)</span>
                <span class="metric-value" id="pwdFastHash">-</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Offline Slow Hash</span>
                <span class="metric-value" id="pwdSlowHash">-</span>
            </div>
        </div>
        <div id="pwdFeedback" class="feedback-box"></div>
    </div>

    <!-- EFF Passphrase Generator Section -->
    <div class="container">
        <div class="section-title">EFF Passphrase Generator</div>
        <div class="passphrase-box" id="passphraseOutput">Click generate below</div>
        <button class="btn btn-full" onclick="generateAndAnalyzePassphrase()">Generate Passphrase & Analyze</button>
        
        <div class="grid">
            <div class="metric-card">
                <span class="metric-label">Score</span>
                <span class="metric-value" id="genScore">-</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Entropy</span>
                <span class="metric-value" id="genEntropy">-</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Length</span>
                <span class="metric-value" id="genLength">-</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Online Attack</span>
                <span class="metric-value" id="genOnline">-</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Offline Fast Hash (GPU)</span>
                <span class="metric-value" id="genFastHash">-</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Offline Slow Hash</span>
                <span class="metric-value" id="genSlowHash">-</span>
            </div>
        </div>
    </div>

    <script>
        async function evaluatePassword() {
            const pwd = document.getElementById('passwordInput').value;
            if (!pwd) {
                resetMetrics('pwd');
                return;
            }

            try {
                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pwd })
                });
                const data = await response.json();
                populateMetrics('pwd', data, pwd);
            } catch (err) {
                console.error("Error evaluating password:", err);
            }
        }

        async function generateAndAnalyzePassphrase() {
            try {
                const response = await fetch('/api/generate?words=4&separator=-');
                const data = await response.json();
                if (data.passphrase) {
                    document.getElementById('passphraseOutput').innerText = data.passphrase;
                    
                    // Automatically evaluate the generated passphrase to fill out the bottom grid
                    const checkResponse = await fetch('/api/check', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: data.passphrase })
                    });
                    const checkData = await checkResponse.json();
                    populateMetrics('gen', checkData, data.passphrase);
                }
            } catch (err) {
                console.error("Error generating passphrase:", err);
            }
        }

        function populateMetrics(prefix, data, text) {
            // Score out of 4 (zxcvbn score is 0-4)
            document.getElementById(prefix + 'Score').innerText = `${data.score} / 4`;
            
            // Length
            document.getElementById(prefix + 'Length').innerText = `${text.length} chars`;

            // Entropy calculation estimation (bits) based on length or crack times if available
            let approxEntropy = (text.length * 4.2).toFixed(1);
            document.getElementById(prefix + 'Entropy').innerText = `${approxEntropy} bits`;

            // Crack times / attacks from zxcvbn display dict
            const crackDisplay = data.crack_times_display || {};
            document.getElementById(prefix + 'Online').innerText = crackDisplay.online_throttling_100_per_hour || '-';
            document.getElementById(prefix + 'FastHash').innerText = crackDisplay.offline_fast_hashing_1e10_per_second || '-';
            document.getElementById(prefix + 'SlowHash').innerText = crackDisplay.offline_slow_hashing_1e4_per_second || '-';

            // Optional warning feedback for evaluator section
            if (prefix === 'pwd') {
                const feedbackEl = document.getElementById('pwdFeedback');
                if (data.feedback && data.feedback.warning) {
                    feedbackEl.innerText = `⚠️ ${data.feedback.warning}`;
                } else if (data.feedback && data.feedback.suggestions && data.feedback.suggestions.length > 0) {
                    feedbackEl.innerText = `💡 ${data.feedback.suggestions[0]}`;
                } else {
                    feedbackEl.innerText = '';
                }
            }
        }

        function resetMetrics(prefix) {
            document.getElementById(prefix + 'Score').innerText = '-';
            document.getElementById(prefix + 'Entropy').innerText = '-';
            document.getElementById(prefix + 'Length').innerText = '-';
            document.getElementById(prefix + 'Online').innerText = '-';
            document.getElementById(prefix + 'FastHash').innerText = '-';
            document.getElementById(prefix + 'SlowHash').innerText = '-';
            if(prefix === 'pwd') {
                document.getElementById('pwdFeedback').innerText = '';
            }
        }
    </script>
</body>
</html>
