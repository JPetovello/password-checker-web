<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Security Check</title>
</head>
<body>
    <main>
        <h1>Password & Passphrase Tool</h1>
        <form id="generator-form">
            <label for="wordCountSelect">Number of Words (3-10):</label>
            <input 
                type="number" 
                id="wordCountSelect" 
                name="wordCountSelect" 
                min="3" 
                max="10" 
                value="4" 
                aria-label="Select number of words for passphrase generation" 
                required
            >
            <button type="button" id="generateBtn" aria-label="Generate secure passphrase">Generate Passphrase</button>
        </form>

        <div id="passphraseOutput" aria-live="polite" class="text-slate-400"></div>
    </main>
</body>
</html>
